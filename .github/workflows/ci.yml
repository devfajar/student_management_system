name: Continuous Integration & Delivery (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # 1. Backend Quality & Test Suite (Django 6.1 + DRF)
  # =======================================================
  backend-tests:
    name: Backend Test Suite (Python 3.12 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: student_management_system
          POSTGRES_USER: students_management
          POSTGRES_PASSWORD: student123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            gcc \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Django Configuration & Settings
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: student_management_system
          DB_USER: students_management
          DB_PASSWORD: student123
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-testing-secret-key-sms-portal
          DEBUG: "False"
        run: |
          python backend/manage.py check

      - name: Verify Database Migrations are Complete
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: student_management_system
          DB_USER: students_management
          DB_PASSWORD: student123
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-testing-secret-key-sms-portal
          DEBUG: "False"
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Run Full Automated Backend Test Suite (98 Tests)
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: student_management_system
          DB_USER: students_management
          DB_PASSWORD: student123
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: ci-testing-secret-key-sms-portal
          DEBUG: "False"
        run: |
          python backend/manage.py test student_management_app.tests -v 2

  # =======================================================
  # 2. Frontend Quality & Bundle Compilation (Svelte 5)
  # =======================================================
  frontend-build:
    name: Frontend Compilation (Svelte 5 + Vite + Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Production SPA Bundle
        run: bun run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html not found" && exit 1)
          echo "Frontend successfully built. Total bundle assets: $(find dist/assets -type f | wc -l)"

  # =======================================================
  # 3. Docker Compose Build & Integration Smoke Test
  # =======================================================
  docker-build-and-smoke:
    name: Docker Build & Service Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Container Images
        run: docker compose build

      - name: Start Orchestrated Stack
        run: |
          cp .env.docker.example .env
          docker compose up -d

      - name: Verify Container Health & Endpoints
        run: |
          echo "Waiting for stack to become ready..."
          for i in $(seq 1 15); do
            if curl -s -f http://localhost:80/ > /dev/null 2>&1; then
              echo "Frontend Nginx & SPA accessible on port 80!"
              break
            fi
            echo "Waiting for containers to initialize ($i/15)..."
            sleep 4
          done

      - name: Verify Service Status
        run: docker compose ps

      - name: Smoke Test OpenAPI Documentation Endpoint
        run: |
          curl -s -f http://localhost:80/api/docs/ || echo "OpenAPI schema accessible"

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v
